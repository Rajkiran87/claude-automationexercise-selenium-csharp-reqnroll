name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC, catches changes on the live site

jobs:
  ui-tests:
    name: UI tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one browser failing should not cancel the others
      matrix:
        browser: [ chrome, firefox, edge ]
    env:
      HEADLESS: 'true'
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The API scenarios do not use a browser, so they run once in their own job below
      # 2 parallel scenarios per job (4 locally): 3 browser jobs run at once, and more
      # simultaneous browsers overload both the CI machine and the shared demo site
      - name: Run UI tests (headless ${{ matrix.browser }})
        run: dotnet test --filter "Category!=api" --logger "html;LogFileName=test-report.html" --logger "trx;LogFileName=test-results.trx" -- NUnit.NumberOfTestWorkers=2

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: |
            TestResults/
            bin/Debug/net8.0/Screenshots/

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run API tests
        run: dotnet test --filter "Category=api" --logger "html;LogFileName=api-report.html"

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: TestResults/
